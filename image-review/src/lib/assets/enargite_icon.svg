<!-- Left crystal -->
<polygon points="270,560 310,540 310,360 270,380" fill="#0d0d1a"/>
<polygon points="160,380 270,380 310,360 200,360" fill="#2c2c44"/>
<polygon points="160,560 270,560 270,380 160,380" fill="#1a1a2c"/>
<g clip-path="url(#cl)">
  <line x1="175" y1="370" x2="175" y2="565" stroke="#2e2e4a" stroke-width="1.2"/>
  <line x1="190" y1="370" x2="190" y2="565" stroke="#2e2e4a" stroke-width="1.2"/>
  <line x1="205" y1="370" x2="205" y2="565" stroke="#2e2e4a" stroke-width="1.2"/>
