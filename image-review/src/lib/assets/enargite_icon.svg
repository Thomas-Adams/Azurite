  <line x1="360" y1="150" x2="360" y2="565" stroke="#2e2e4e" stroke-width="1.2"/>
  <line x1="375" y1="150" x2="375" y2="565" stroke="#2e2e4e" stroke-width="1.2"/>
  <line x1="390" y1="150" x2="390" y2="565" stroke="#2e2e4e" stroke-width="1.2"/>
